<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PaisaTrip - Flujo Git</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700;400&display=swap');
    body { font-family: 'Poppins', sans-serif; background: #fffcf0; text-align: center; padding: 30px; }
    h1 { color: #0a8a4b; margin:0; font-size: 35px; }
    .flujo { display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; }
    .caja { background: white; border: 3px solid black; border-radius: 20px; width: 210px; padding: 25px 15px; box-shadow: 7px 7px 0px black; }
    .icono { font-size: 40px; }
    .flecha { font-size: 35px; font-weight: bold; }
    .comando { background: #111; color: #ffe600; padding: 6px 12px; border-radius: 8px; font-family: monospace; display: inline-block; margin: 4px; font-size: 13px; }
    .final { margin-top: 40px; background: #0a8a4b; color: white; display: inline-block; padding: 12px 25px; border-radius: 30px; font-weight: bold; }
  </style>
</head>
<body>
  <div style="font-size:50px">🌼</div>
  <h1>PaisaTrip</h1>
  <p>Turismo Local Medellín - te damos mejores experiencias</p>
  <div class="flujo">
    <div class="caja"><div class="icono">💻</div><h2>1. Project</h2><p>Área de trabajo</p><div class="comando">git init</div></div>
    <div class="flecha">→</div>
    <div class="caja"><div class="icono">📦</div><h2>2. Stage</h2><p>Área temporal</p><div class="comando">git add .</div></div>
    <div class="flecha">→</div>
    <div class="caja"><div class="icono">💾</div><h2>3. Commit</h2><p>Versionado</p><div class="comando">git commit -m ""</div></div>
    <div class="flecha">→</div>
    <div class="caja"><div class="icono">🚀</div><h2>4. GitHub</h2><p>Nube</p><div class="comando"></div></div>
  </div>
  <br><div class="final">¡Así trabajamos los 4 en PaisaTrip! - Medellín</div>
</body>
</html>
